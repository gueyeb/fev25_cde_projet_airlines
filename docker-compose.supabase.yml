version: '3.8'

services:
  # Prefect Server - Uses SQLite for metadata storage
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: dst-airlines-prefect-server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    ports:
      - "4201:4200"
    environment:
      # Use SQLite for Prefect metadata (simpler, no external database needed)
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////root/.prefect/prefect.db
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      # External URL for browser access
      PREFECT_UI_API_URL: https://dst-prefect.srv869578.hstgr.cloud/api
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - dst-airlines-network
      - dst_airlines_supabase_default
      - root_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.dst-prefect.rule=Host(`dst-prefect.srv869578.hstgr.cloud`)"
      - "traefik.http.routers.dst-prefect.entrypoints=web,websecure"
      - "traefik.http.routers.dst-prefect.tls=true"
      - "traefik.http.routers.dst-prefect.tls.certresolver=mytlschallenge"
      - "traefik.http.services.dst-prefect.loadbalancer.server.port=4200"

  # Prefect Worker - Executes workflows
  prefect-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dst-airlines-prefect-agent
    restart: unless-stopped
    command: prefect worker start --pool default
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app
      # Database connection to Supabase (direct container connection)
      PG_HOST: dst-airlines-supabase-db
      PG_PORT: 5432
      PG_DB: postgres
      PG_USER: postgres
      PG_PASSWORD: d0e6de882220c43de3d3ef5abf0c31c7c87145f936918938e9a6120458e94977
    env_file:
      - config/.env
    volumes:
      - ./logs:/app/logs
      - ./prefect_flows:/app/prefect_flows
      - ./src:/app/src
      - ./database:/app/database
      - ./config:/app/config
    depends_on:
      - prefect-server
    networks:
      - dst-airlines-network
      - dst_airlines_supabase_default

  # FastAPI Web Application - Flight Delay Predictor
  web-app:
    build:
      context: .
      dockerfile: flight-delay-predictor/app/Dockerfile
      args:
        BUILD_CONTEXT: "root"
    container_name: dst-airlines-web
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      PYTHONPATH: /app
      # Database connection to Supabase (direct container connection)
      PG_HOST: dst-airlines-supabase-db
      PG_PORT: 5432
      PG_DB: postgres
      PG_USER: postgres
      PG_PASSWORD: d0e6de882220c43de3d3ef5abf0c31c7c87145f936918938e9a6120458e94977
    env_file:
      - config/.env
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./database:/app/database:ro
    networks:
      - dst-airlines-network
      - dst_airlines_supabase_default
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.dst-airlines.rule=Host(`dst-airlines.srv869578.hstgr.cloud`)"
      - "traefik.http.routers.dst-airlines.entrypoints=web,websecure"
      - "traefik.http.routers.dst-airlines.tls=true"
      - "traefik.http.routers.dst-airlines.tls.certresolver=mytlschallenge"
      - "traefik.http.services.dst-airlines.loadbalancer.server.port=8000"

volumes:
  prefect_data:
    driver: local

networks:
  dst-airlines-network:
    driver: bridge
  dst_airlines_supabase_default:
    external: true
  root_default:
    external: true
