version: '3.8'

# Standalone local development setup
# Usage: docker compose -f docker-compose.local.yml up -d
# Or: ./deploy-dst-airlines.sh start-local

services:
  # Local PostgreSQL
  postgres:
    image: postgres:15
    container_name: dst-airlines-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-localdev}
      POSTGRES_DB: ${PG_DB:-postgres}
    ports:
      - "${PG_PORT_EXPOSE:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - dst-airlines-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prefect Server
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: dst-airlines-prefect-server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    ports:
      - "4201:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////root/.prefect/prefect.db
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_API_URL: http://localhost:4201/api
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - dst-airlines-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prefect Worker
  prefect-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dst-airlines-prefect-agent
    restart: unless-stopped
    command: prefect worker start --pool default
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-localdev}
    env_file:
      - config/.env
    volumes:
      - ./logs:/app/logs
      - ./prefect_flows:/app/prefect_flows
      - ./src:/app/src
      - ./database:/app/database
      - ./config:/app/config
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dst-airlines-network

  # FastAPI Web Application
  web-app:
    build:
      context: .
      dockerfile: flight-delay-predictor/app/Dockerfile
      args:
        BUILD_CONTEXT: "root"
    container_name: dst-airlines-web
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      PYTHONPATH: /app
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-localdev}
    env_file:
      - config/.env
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./database:/app/database:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dst-airlines-network

volumes:
  prefect_data:
    driver: local
  postgres_local_data:
    driver: local

networks:
  dst-airlines-network:
    driver: bridge
