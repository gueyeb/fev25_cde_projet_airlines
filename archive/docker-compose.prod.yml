version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: flight-delay-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-flight_delay_db}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/sql:/docker-entrypoint-initdb.d
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flight-delay-network

  # Serveur Prefect
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: flight-delay-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - flight-delay-network

  # Agent Prefect pour exécuter les workflows
  prefect-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-delay-prefect-agent
    command: prefect agent start -q default
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PYTHONPATH=/app
    env_file:
      - config/.prodenv
    volumes:
      - ./logs:/app/logs
      - ./prefect_flows:/app/prefect_flows
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flight-delay-network

  # Application web FastAPI (optionnelle)
  web-app:
    build:
      context: ./flight-delay-predictor
      dockerfile: Dockerfile
    container_name: flight-delay-web
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    env_file:
      - config/.prodenv
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flight-delay-network

volumes:
  postgres_data:
    driver: local
  prefect_data:
    driver: local

networks:
  flight-delay-network:
    driver: bridge
