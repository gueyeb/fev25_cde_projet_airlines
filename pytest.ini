[pytest]
# Configuration pytest

# Chemins de recherche des tests
testpaths = tests

# Options par défaut
addopts =
    -v
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -p no:warnings

# Marqueurs personnalisés
markers =
    slow: marque les tests comme lents (à déselectionner avec -m 'not slow')
    integration: tests d'intégration nécessitant des ressources externes
    unit: tests unitaires purs
    api: tests nécessitant des appels API externes

# Modèle de nom de fichier de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Options de couverture
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
