<!-- frontend/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DST Airlines - Flight Delay Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .autocomplete-results {
            max-height: 250px;
            overflow-y: auto;
            z-index: 1050;
        }
        .autocomplete-item {
            cursor: pointer;
        }
        .autocomplete-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center mb-0">✈️ Flight Delay Prediction</h3>
                    </div>
                    <div class="card-body">
                        <form id="prediction-form" autocomplete="off">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="flight-number" class="form-label">Flight Number</label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="flight-number" placeholder="Type flight number (e.g. LH400)..." autocomplete="off" required>
                                        <div id="flight-results" class="list-group position-absolute w-100 shadow autocomplete-results d-none"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="airline-search" class="form-label">Airline</label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="airline-search" placeholder="Type to search airline..." autocomplete="off">
                                        <input type="hidden" id="airline">
                                        <div id="airline-results" class="list-group position-absolute w-100 shadow autocomplete-results d-none"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="departure-search" class="form-label">
                                        <i class="bi bi-airplane-engines me-1"></i>Departure Airport
                                    </label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="departure-search" placeholder="Type city or code..." autocomplete="off" required>
                                        <input type="hidden" id="departure-airport">
                                        <div id="departure-results" class="list-group position-absolute w-100 shadow autocomplete-results d-none"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="arrival-search" class="form-label">
                                        <i class="bi bi-geo-alt me-1"></i>Arrival Airport
                                    </label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="arrival-search" placeholder="Type city or code..." autocomplete="off" required>
                                        <input type="hidden" id="arrival-airport">
                                        <div id="arrival-results" class="list-group position-absolute w-100 shadow autocomplete-results d-none"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="scheduled-date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="scheduled-date" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="scheduled-time" class="form-label">Time</label>
                                    <input type="text" class="form-control" id="scheduled-time" placeholder="Select time..." required>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Predict Delay</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Results Card -->
                <div id="results-card" class="card shadow mt-4 d-none">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Prediction Results</h4>
                    </div>
                    <div class="card-body">
                        <!-- Map and Weather Section -->
                        <div class="row mb-4">
                            <div class="col-md-12 mb-3">
                                <div id="route-map" style="height: 300px; width: 100%; border-radius: 8px; z-index: 1;"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body d-flex align-items-center">
                                        <div class="display-6 me-3" id="dep-weather-icon">☀️</div>
                                        <div>
                                            <h6 class="card-subtitle mb-1 text-muted">Departure Weather</h6>
                                            <h5 class="card-title mb-0" id="dep-weather-desc">Clear Sky</h5>
                                            <small class="text-muted" id="dep-weather-temp">20°C</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body d-flex align-items-center">
                                        <div class="display-6 me-3" id="arr-weather-icon">🌤️</div>
                                        <div>
                                            <h6 class="card-subtitle mb-1 text-muted">Arrival Weather</h6>
                                            <h5 class="card-title mb-0" id="arr-weather-desc">Partly Cloudy</h5>
                                            <small class="text-muted" id="arr-weather-temp">18°C</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="prediction-gauge">
                                    <h5>Delay Probability</h5>
                                    <div class="progress mb-2" style="height: 25px;">
                                        <div id="delay-probability-bar" class="progress-bar" role="progressbar"></div>
                                    </div>
                                    <p id="delay-probability-text" class="text-center fw-bold"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="prediction-gauge">
                                    <h5>Estimated Delay</h5>
                                    <p id="delay-estimate" class="display-4 text-center text-primary"></p>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="row">
                                <div class="col-md-6">
                                    <h5>Contributing Factors</h5>
                                    <ul id="factors-list" class="list-group">
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <h5>Factor Analysis</h5>
                                    <canvas id="factors-chart" width="300" height="200"></canvas>
                                </div>
                            </div>
                        </div>

                        <!-- Historical Trends Section -->
                        <div class="mt-4 border-top pt-3">
                            <h5 class="mb-3"><i class="bi bi-graph-up me-2"></i>Historical Delay Trends (Route Average)</h5>
                            <div class="position-relative" style="height: 300px; width: 100%;">
                                <canvas id="trends-chart"></canvas>
                                <div id="no-trends-data" class="position-absolute top-50 start-50 translate-middle text-center d-none">
                                    <p class="text-muted">No historical data available for this route yet.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
