name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest pytest-cov

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,env,.git,__pycache__
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,env,.git,__pycache__

    - name: Set up test environment variables
      run: |
        echo "PG_HOST=localhost" >> $GITHUB_ENV
        echo "PG_PORT=5432" >> $GITHUB_ENV
        echo "PG_DB=test_db" >> $GITHUB_ENV
        echo "PG_USER=postgres" >> $GITHUB_ENV
        echo "PG_PASSWORD=postgres" >> $GITHUB_ENV

    - name: Run tests
      run: |
        # Run pytest with coverage
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check for security vulnerabilities
      run: |
        pip install safety
        # Check for known security vulnerabilities in dependencies
        safety check --json || true

  build-validation:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Validate project structure
      run: |
        echo "[INFO] Validating project structure..."

        # Check critical directories exist
        test -d src || { echo "[ERROR] src directory missing"; exit 1; }
        test -d database || { echo "[ERROR] database directory missing"; exit 1; }
        test -d config || { echo "[ERROR] config directory missing"; exit 1; }

        # Check critical files exist
        test -f requirements.txt || { echo "[ERROR] requirements.txt missing"; exit 1; }
        test -f run_project.sh || { echo "[ERROR] run_project.sh missing"; exit 1; }

        echo "[SUCCESS] Project structure validation passed"

    - name: Check for secrets in code
      run: |
        echo "[INFO] Checking for potential secrets in code..."

        # Check for common secret patterns (excluding test files and example files)
        if grep -r -E "(api[_-]?key|secret|password|token)\s*=\s*['\"][^'\"]{8,}" --exclude-dir={.git,venv,env,__pycache__} --exclude="*.example" --exclude="*.md" .; then
          echo "[WARNING] Potential secrets found in code. Please review."
          exit 1
        fi

        echo "[SUCCESS] No obvious secrets found in code"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check if Dockerfile exists
      id: check_dockerfile
      run: |
        if [ -f Dockerfile ]; then
          echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
        else
          echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      if: steps.check_dockerfile.outputs.dockerfile_exists == 'true'
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      if: steps.check_dockerfile.outputs.dockerfile_exists == 'true'
      run: |
        docker build -t airline-delay-predictor:${{ github.sha }} .
        echo "[SUCCESS] Docker image built successfully"

    - name: Skip Docker build
      if: steps.check_dockerfile.outputs.dockerfile_exists == 'false'
      run: |
        echo "[INFO] No Dockerfile found. Skipping Docker build."

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-validation, docker-build]
    # Only deploy on push to main (not PRs or other branches)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
            set -e

            echo "================================================"
            echo "🚀 Starting Deployment: DST Airlines"
            echo "Timestamp: $(date)"
            echo "================================================"

            # Run centralized deployment script
            /root/deploy-project.sh dst-airlines --quick

            echo "================================================"
            echo "✅ Deployment completed successfully!"
            echo "Timestamp: $(date)"
            echo "================================================"
          ENDSSH

      - name: Verify deployment
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
            echo "🔍 Verifying deployment..."

            # Use centralized script to check status
            /root/deploy-project.sh dst-airlines --status

            echo ""
            echo "✅ Deployment verification passed!"
          ENDSSH

      - name: Send deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Web App: https://dst-airlines.srv869578.hstgr.cloud"
            echo "Prefect UI: https://dst-prefect.srv869578.hstgr.cloud"
            echo "Supabase Studio: https://dst-airlines-studio.srv869578.hstgr.cloud"
          else
            echo "❌ Deployment failed! Check logs for details."
          fi
