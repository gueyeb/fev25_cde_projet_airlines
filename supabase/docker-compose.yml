# Supabase Self-Hosted Stack
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Destroy: docker compose down -v --remove-orphans
#   Reset:   ./reset.sh

name: dst-airlines-supabase

# =============================================================================
# Reusable Configuration Anchors
# =============================================================================

x-common-restart: &common-restart
  restart: unless-stopped

x-common-healthcheck-timeout: &healthcheck-timeout
  timeout: 5s
  interval: 5s
  retries: 3

x-traefik-security-headers: &traefik-security-headers
  traefik.http.middlewares.{service}.headers.SSLRedirect: "true"
  traefik.http.middlewares.{service}.headers.STSSeconds: "315360000"
  traefik.http.middlewares.{service}.headers.browserXSSFilter: "true"
  traefik.http.middlewares.{service}.headers.contentTypeNosniff: "true"
  traefik.http.middlewares.{service}.headers.forceSTSHeader: "true"
  traefik.http.middlewares.{service}.headers.STSIncludeSubdomains: "true"
  traefik.http.middlewares.{service}.headers.STSPreload: "true"

# =============================================================================
# Services
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # User Interface
  # ---------------------------------------------------------------------------

  studio:
    container_name: dst-airlines-supabase-studio
    image: supabase/studio:2025.10.20-sha-5005fc6
    <<: *common-restart
    networks:
      - default
      - root_default
    healthcheck:
      <<: *healthcheck-timeout
      test:
        - CMD
        - node
        - -e
        - fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})
      timeout: 10s
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      HOSTNAME: "::"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://analytics:4000
      NEXT_PUBLIC_ENABLE_LOGS: true
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.dst-airlines-studio.rule=Host(`${SUPABASE_STUDIO_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.dst-airlines-studio.entrypoints=web,websecure
      - traefik.http.routers.dst-airlines-studio.tls=true
      - traefik.http.routers.dst-airlines-studio.tls.certresolver=mytlschallenge
      - traefik.http.routers.dst-airlines-studio.middlewares=dst-airlines-studio@docker
      - traefik.http.middlewares.dst-airlines-studio.headers.SSLRedirect=true
      - traefik.http.middlewares.dst-airlines-studio.headers.STSSeconds=315360000
      - traefik.http.middlewares.dst-airlines-studio.headers.browserXSSFilter=true
      - traefik.http.middlewares.dst-airlines-studio.headers.contentTypeNosniff=true
      - traefik.http.middlewares.dst-airlines-studio.headers.forceSTSHeader=true
      - traefik.http.middlewares.dst-airlines-studio.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.dst-airlines-studio.headers.STSPreload=true
      - traefik.http.services.dst-airlines-studio.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------

  kong:
    container_name: dst-airlines-supabase-kong
    image: kong:2.8.1
    <<: *common-restart
    networks:
      - default
      - root_default
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.dst-airlines-kong.rule=Host(`${SUPABASE_API_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.dst-airlines-kong.entrypoints=web,websecure
      - traefik.http.routers.dst-airlines-kong.tls=true
      - traefik.http.routers.dst-airlines-kong.tls.certresolver=mytlschallenge
      - traefik.http.routers.dst-airlines-kong.middlewares=dst-airlines-kong@docker
      - traefik.http.middlewares.dst-airlines-kong.headers.SSLRedirect=true
      - traefik.http.middlewares.dst-airlines-kong.headers.STSSeconds=315360000
      - traefik.http.middlewares.dst-airlines-kong.headers.browserXSSFilter=true
      - traefik.http.middlewares.dst-airlines-kong.headers.contentTypeNosniff=true
      - traefik.http.middlewares.dst-airlines-kong.headers.forceSTSHeader=true
      - traefik.http.middlewares.dst-airlines-kong.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.dst-airlines-kong.headers.STSPreload=true
      - traefik.http.middlewares.dst-airlines-kong.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - traefik.http.middlewares.dst-airlines-kong.headers.accessControlAllowHeaders=accept,accept-encoding,authorization,content-type,dnt,origin,user-agent,x-requested-with,x-client-info,apikey,prefer,range,x-supabase-api-version
      - traefik.http.middlewares.dst-airlines-kong.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.dst-airlines-kong.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.dst-airlines-kong.headers.accessControlAllowCredentials=true
      - traefik.http.services.dst-airlines-kong.loadbalancer.server.port=8000

  # ---------------------------------------------------------------------------
  # Authentication Service
  # ---------------------------------------------------------------------------

  auth:
    container_name: dst-airlines-supabase-auth
    image: supabase/gotrue:v2.180.0
    <<: *common-restart
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timeout
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  # ---------------------------------------------------------------------------
  # REST API (PostgREST)
  # ---------------------------------------------------------------------------

  rest:
    container_name: dst-airlines-supabase-rest
    image: postgrest/postgrest:v13.0.7
    <<: *common-restart
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: [postgrest]

  # ---------------------------------------------------------------------------
  # Realtime Service
  # ---------------------------------------------------------------------------

  realtime:
    container_name: dst-airlines-supabase-realtime
    image: supabase/realtime:v2.56.0
    <<: *common-restart
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timeout
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - -H
        - "Authorization: Bearer ${ANON_KEY}"
        - http://localhost:4000/api/tenants/realtime-dev/health
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: true
      RUN_JANITOR: true

  # ---------------------------------------------------------------------------
  # Storage Service
  # ---------------------------------------------------------------------------

  storage:
    container_name: dst-airlines-supabase-storage
    image: supabase/storage-api:v1.28.1
    <<: *common-restart
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      <<: *healthcheck-timeout
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001

  imgproxy:
    container_name: dst-airlines-supabase-imgproxy
    image: darthsim/imgproxy:v3.8.0
    <<: *common-restart
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    healthcheck:
      <<: *healthcheck-timeout
      test: [CMD, imgproxy, health]
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}

  # ---------------------------------------------------------------------------
  # Database Metadata Service
  # ---------------------------------------------------------------------------

  meta:
    container_name: dst-airlines-supabase-meta
    image: supabase/postgres-meta:v0.93.0
    <<: *common-restart
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      # Use connection string to force correct port (workaround for v0.93.0 bug)
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # ---------------------------------------------------------------------------
  # Edge Functions Runtime
  # ---------------------------------------------------------------------------

  functions:
    container_name: dst-airlines-supabase-edge-functions
    image: supabase/edge-runtime:v1.69.14
    <<: *common-restart
    volumes:
      - ./volumes/functions:/home/deno/functions:Z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
    command: ["start", "--main-service", "/home/deno/functions/manage-users"]

  # ---------------------------------------------------------------------------
  # Analytics & Logging
  # ---------------------------------------------------------------------------

  analytics:
    container_name: dst-airlines-supabase-analytics
    image: supabase/logflare:1.22.6
    <<: *common-restart
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      timeout: 5s
      interval: 5s
      retries: 10
      test: [CMD, curl, http://localhost:4000/health]
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_SINGLE_TENANT: true
      LOGFLARE_SUPABASE_MODE: true
      LOGFLARE_MIN_CLUSTER_SIZE: 1
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true

  vector:
    container_name: dst-airlines-supabase-vector
    image: timberio/vector:0.28.1-alpine
    <<: *common-restart
    volumes:
      - ./volumes/logs/vector.yml:/etc/vector/vector.yml:ro,z
      - ${DOCKER_SOCKET_LOCATION}:/var/run/docker.sock:ro,z
    healthcheck:
      <<: *healthcheck-timeout
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://vector:9001/health
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    command: [--config, /etc/vector/vector.yml]
    security_opt:
      - label=disable

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------

  db:
    container_name: dst-airlines-supabase-db
    image: supabase/postgres:15.8.1.085
    <<: *common-restart
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - db-config:/etc/postgresql-custom
    depends_on:
      vector:
        condition: service_healthy
    healthcheck:
      timeout: 5s
      interval: 5s
      retries: 10
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # ---------------------------------------------------------------------------
  # Connection Pooler
  # ---------------------------------------------------------------------------

  supavisor:
    container_name: dst-airlines-supabase-pooler
    image: supabase/supavisor:2.7.3
    <<: *common-restart
    ports:
      - 5433:5432
      - 6544:6543
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      timeout: 5s
      interval: 10s
      retries: 5
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - http://127.0.0.1:4000/api/health
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server

# =============================================================================
# Volumes & Networks
# =============================================================================

volumes:
  db-config:

networks:
  default:
    name: dst_airlines_supabase_default
  root_default:
    external: true
