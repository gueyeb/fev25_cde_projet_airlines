version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres_dst
    restart: always
    environment:
      POSTGRES_DB: dst_airlines
      POSTGRES_USER: dst_user
      POSTGRES_PASSWORD: dst_password
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dst_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dst_user -d dst_airlines"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb_dst
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: dst_user
      MONGO_INITDB_ROOT_PASSWORD: dst_password
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dst_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect_server_dst
    restart: always
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://dst_user:dst_password@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dst_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dst-airlines-prefect-agent
    restart: unless-stopped
    command: prefect worker start --pool default
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: dst_airlines
      PG_USER: dst_user
      PG_PASSWORD: dst_password
    volumes:
      - ./logs:/app/logs
      - ./prefect_flows:/app/prefect_flows
      - ./src:/app/src
      - ./database:/app/database
      - ./config:/app/config
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dst_net

  backend:
    build:
      context: ./flight-delay-predictor/app
      dockerfile: Dockerfile
    container_name: dst-airlines-backend
    ports:
      - "8000:8000"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=dst_airlines
      - PG_USER=dst_user
      - PG_PASSWORD=dst_password
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=dst_airlines
    volumes:
      - ./flight-delay-predictor/app:/app
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - dst_net
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - dst_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - dst_net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dst_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - dst_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - dst_net

volumes:
  pg_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  dst_net:
    driver: bridge