version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: postgres_dst
    restart: always
    environment:
      POSTGRES_DB: dst_airlines
      POSTGRES_USER: dst_user
      POSTGRES_PASSWORD: dst_password
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dst_net

volumes:
  pg_data:

networks:
  dst_net:
    driver: bridge